name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Matches the floor in go.mod. Kept exact rather than "stable" so that a
          # future toolchain bump is a deliberate commit, not a silent CI change.
          go-version: '1.25'
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Coverage that is only reported is coverage that rots. The floors are per
      # package and dropping below one fails here, so a change that adds code without
      # tests has to say so in its own diff.
      - name: Coverage floors
        run: python3 .github/scripts/check_coverage.py

      # The scheduler shares state with HTTP handlers, so the race detector earns its
      # place in CI rather than being something to remember to run.
      - name: Test with the race detector
        run: go test -race ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/almanack

  frontend:
    name: Frontend integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The browser code has no toolchain, so these are the checks a build step would
      # otherwise have caught: unresolved module imports, a module missing from the
      # service worker's precache list, and translation keys used but never defined.
      - name: Check imports, precache list and translations
        run: python3 .github/scripts/check_frontend.py

  browser:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          check-latest: true

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Three of the bugs 0.2.0 fixed were only reachable through a real browser: an
      # upload the app's own CSP forbade, an invite link that never opened the join
      # screen, and a new build that could not reach an open tab. None of them could
      # fail a Go test, so these run here rather than being something to remember.
      #
      # npm appears only in this job. The e2e directory is the one place the dependency
      # policy allows it (internal/deps/deps_test.go), and nothing it installs is
      # committed or reaches the binary.
      # No --with-deps, deliberately. On this runner it installed exactly nine packages
      # and every one was a font: Japanese, Thai, Chinese, Cyrillic and unifont, 21 MB
      # from the Ubuntu archive on every run. Not one shared library — Chromium's are
      # already in the runner image, which is what "0 upgraded, 9 newly installed" in
      # the old logs was saying. This suite renders French and English and asserts on
      # text and ARIA roles, never on pixels, so those fonts drew nothing it looks at.
      #
      # They were also the whole of this job's tail. Measured over twelve runs the step
      # took 23–31 s eleven times and 638 s once, and the 638 was the same 21 MB coming
      # off azure.archive.ubuntu.com at about 35 kB/s. Nothing was wrong with the
      # workflow that day; the mirror was slow, and the only defence against a slow
      # mirror is not to need it.
      #
      # If a future runner image ever does drop one of Chromium's libraries, this fails
      # loudly and legibly — Playwright validates the host before launching and names
      # the missing packages — and the fix is to put --with-deps back on this line.
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install --no-save @playwright/test
          npx playwright install chromium

      # The server is started inside this step rather than a previous one, so that it
      # is still running when the tests execute.
      - name: Seed a demo family and run the tests
        run: |
          make seed
          make dev > /tmp/almanack-server.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8080/healthz > /dev/null; then
              ready=1; break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "the server never became ready:"; cat /tmp/almanack-server.log; exit 1
          fi
          cd e2e && npx playwright test --retries=1

      - name: Server log
        if: failure()
        run: cat /tmp/almanack-server.log || true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results/
          if-no-files-found: ignore
