<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Almanack</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
<!-- iOS ignores SVG here: without a PNG the home-screen icon becomes a screenshot
     of the page, and the home screen is the only place iOS notifications work. -->
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
<meta name="theme-color" content="#f7f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15161a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanack">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
</head>
<body>
<div id="app" class="app"></div>
<div id="modal-root"></div>
<noscript>Almanack — JavaScript</noscript>
<script type="module" src="/js/app.js"></script>
</body>
</html>
